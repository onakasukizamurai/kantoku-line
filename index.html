<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="自分の返信を入れると、部活の監督がコンサルの詰め方で返してくるブラウザ練習。LINEには繋がっていません。" />
  <meta name="theme-color" content="#14171c" />
  <link rel="canonical" href="https://onakasukizamurai.github.io/kantoku-line/" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ja_JP" />
  <meta property="og:url" content="https://onakasukizamurai.github.io/kantoku-line/" />
  <meta property="og:title" content="監督の返信シミュレーター" />
  <meta property="og:description" content="自分の返信を入れると、部活の監督がコンサルの詰め方で返してくる。論点・目的・根拠まで分解される練習ページです。" />
  <meta property="og:site_name" content="監督の返信シミュレーター" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="監督の返信シミュレーター" />
  <meta name="twitter:description" content="自分の返信を入れると、部活の監督がコンサルの詰め方で返してくる練習ページです。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b7aa3'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='32' font-family='sans-serif' fill='white'%3E監%3C/text%3E%3C/svg%3E" />
  <title>監督の返信シミュレーター</title>
  <style>
    :root {
      --bg: #8cabd9;
      --green: #95ec69;
      --ink: #111;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(1200px 500px at 20% -10%, #2a3340 0%, transparent 50%),
        #14171c;
      color: #f2f2f2;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
    }

    .site-bar, .site-foot {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px 24px;
      padding: 16px 28px 0;
      flex-wrap: wrap;
    }

    .site-bar {
      flex-direction: column;
    }

    .site-bar h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .site-bar p, .site-foot {
      margin: 0;
      color: #b7bcc4;
      font-size: 12px;
      line-height: 1.6;
    }

    .site-foot {
      padding: 0 28px 16px;
      color: #8b919a;
      font-size: 11px;
    }

    .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 36px;
      padding: 18px 20px;
    }

    .panel {
      width: 260px;
      flex: none;
    }

    .panel h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .panel p {
      margin: 0 0 18px;
      color: #c5c8ce;
      font-size: 13px;
      line-height: 1.7;
    }

    .panel .label {
      margin: 0 0 8px;
      font-size: 12px;
      color: #9aa0a8;
    }

    .levels {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .levels button,
    .ghost {
      appearance: none;
      border: 1px solid #3a404a;
      background: #1c2128;
      color: #eee;
      border-radius: 10px;
      padding: 10px 12px;
      text-align: left;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .levels button.on {
      background: #243224;
      border-color: #6fbf4a;
      color: #d8ffc4;
    }

    .ghost { width: 100%; }

    .hint {
      margin-top: 16px;
      color: #8b919a;
      font-size: 12px;
      line-height: 1.6;
    }

    .phone {
      width: min(400px, 100%);
      height: min(780px, calc(100vh - 120px));
      background: #111;
      border-radius: 32px;
      padding: 10px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      flex: none;
    }

    .screen {
      height: 100%;
      background: var(--bg);
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    header {
      background: #5b7aa3;
      color: white;
      padding: 12px 12px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex: none;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e7eef6;
      color: #3d5d86;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 700;
      flex: none;
    }

    header .who { font-size: 16px; font-weight: 700; line-height: 1.2; }
    header .status { font-size: 11px; opacity: 0.85; }

    .log {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0 8px;
    }

    .day {
      width: fit-content;
      margin: 8px auto 12px;
      background: rgba(0, 0, 0, 0.18);
      color: white;
      font-size: 11px;
      border-radius: 10px;
      padding: 3px 8px;
    }

    .ask {
      margin: 0 10px 8px;
      background: rgba(255, 255, 255, 0.9);
      color: #243044;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
      flex: none;
    }

    .ask b {
      display: block;
      font-size: 10px;
      letter-spacing: 0.06em;
      color: #5c6b80;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      margin: 0 10px 8px;
    }

    .row.me { justify-content: flex-end; }

    .row .face {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #d7e3f1;
      color: #3d5d86;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      flex: none;
    }

    .stack { max-width: 78%; }

    .name {
      color: white;
      font-size: 11px;
      margin: 0 0 3px 2px;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.25);
    }

    .bubble {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.55;
      padding: 8px 10px;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
    }

    .them .bubble {
      background: white;
      color: var(--ink);
      border-radius: 4px 16px 16px 16px;
    }

    .me .bubble {
      background: var(--green);
      color: var(--ink);
      border-radius: 16px 4px 16px 16px;
    }

    .meta {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      align-items: flex-end;
    }

    .read {
      color: white;
      font-size: 10px;
      line-height: 1.2;
      text-align: right;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.25);
      padding-bottom: 1px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 10px 8px;
      flex: none;
    }

    .chips[hidden] {
      display: none;
    }

    .chips button {
      appearance: none;
      border: 0;
      background: rgba(255, 255, 255, 0.88);
      color: #243044;
      border-radius: 999px;
      padding: 7px 10px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    form {
      background: #f3f4f6;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      padding: 8px;
      flex: none;
    }

    textarea {
      flex: 1;
      resize: none;
      border: 0;
      border-radius: 18px;
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
      line-height: 1.45;
      max-height: 120px;
      outline: none;
      background: white;
      color: #111;
    }

    .send {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: #d5d8de;
      color: white;
      font-size: 16px;
      cursor: pointer;
      flex: none;
    }

    .send.ready { background: #06c755; }

    .dots {
      display: inline-flex;
      gap: 4px;
      padding: 4px 2px;
    }

    .dots i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9aa3ad;
      display: block;
      animation: blink 1s infinite ease-in-out;
    }

    .dots i:nth-child(2) { animation-delay: 0.15s; }
    .dots i:nth-child(3) { animation-delay: 0.3s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-1px); }
    }

    @media (max-width: 820px) {
      .site-bar, .site-foot {
        gap: 4px;
        padding-left: 16px;
        padding-right: 16px;
      }
      .stage {
        flex-direction: column;
        align-items: stretch;
        padding: 12px 16px;
      }
      .panel { width: auto; }
      .hint { display: none; }
      .phone { height: min(760px, calc(100vh - 220px)); min-height: 520px; }
    }
  </style>
</head>
<body>
  <div class="site-bar">
    <h1>監督の返信シミュレーター</h1>
    <p>自分の返信を入れると、コンサルの詰め方で返ってきます。</p>
  </div>
  <div class="stage">
    <aside class="panel">
      <p>自分のLINEを入れると、部活の監督がコンサルの詰め方で返してくる。結論ではなく、論点・目的・根拠・意思まで分解される。</p>
      <p class="label">詰め度</p>
      <div class="levels" id="levels">
        <button type="button" data-level="1">まだ優しい</button>
        <button type="button" data-level="2" class="on">ふつうに詰める</button>
        <button type="button" data-level="3">鬼詰め</button>
      </div>
      <button class="ghost" id="reset" type="button">会話を最初から</button>
      <p class="hint">LINEには繋がっていない。送信用ではなく、返し方の練習用。曖昧な返事だと同じ問いが残る。核を一文で書くと、次の問いに進む。</p>
    </aside>

    <div class="phone">
      <div class="screen">
        <header>
          <div class="avatar">監</div>
          <div>
            <div class="who">監督</div>
            <div class="status">オンライン</div>
          </div>
        </header>
        <div class="log" id="log"></div>
        <div class="ask" id="ask"></div>
        <div class="chips" id="chips">
          <button type="button">ちょっと参加むずかしいです</button>
          <button type="button">とりあえず進めようと思ってます</button>
          <button type="button">まだよく分からないです</button>
          <button type="button">どうすればいいですか</button>
        </div>
        <form id="form">
          <textarea id="input" rows="1" placeholder="メッセージ"></textarea>
          <button class="send" id="send" type="submit" aria-label="送信">➤</button>
        </form>
      </div>
    </div>
  </div>
  <p class="site-foot">LINEとは無関係の練習用ページです。リンクを開くだけで使えます。</p>

  <script src="engine.js"></script>
  <script>
    var logEl = document.getElementById("log");
    var form = document.getElementById("form");
    var input = document.getElementById("input");
    var sendBtn = document.getElementById("send");
    var chips = document.getElementById("chips");
    var convo = Kantoku.initial();
    var busy = false;
    var composing = false;

    function scrollDown() {
      logEl.scrollTop = logEl.scrollHeight;
    }

    function nowLabel() {
      var d = new Date();
      return d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
    }

    function addBubble(who, text, withName) {
      var row = document.createElement("div");
      row.className = "row " + who;

      if (who === "them") {
        var face = document.createElement("div");
        face.className = "face";
        face.textContent = withName ? "監" : "";
        face.style.visibility = withName ? "visible" : "hidden";
        var stack = document.createElement("div");
        stack.className = "stack";
        if (withName) {
          var name = document.createElement("div");
          name.className = "name";
          name.textContent = "監督";
          stack.appendChild(name);
        }
        var bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        stack.appendChild(bubble);
        row.appendChild(face);
        row.appendChild(stack);
      } else {
        var read = document.createElement("div");
        read.className = "read";
        read.textContent = "既読\n" + nowLabel();
        var mine = document.createElement("div");
        mine.className = "bubble";
        mine.textContent = text;
        row.appendChild(read);
        row.appendChild(mine);
      }

      logEl.appendChild(row);
      scrollDown();
    }

    function showTyping() {
      var row = document.createElement("div");
      row.className = "row them";
      row.id = "typing";
      var face = document.createElement("div");
      face.className = "face";
      face.textContent = "監";
      var stack = document.createElement("div");
      stack.className = "stack";
      var bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
      stack.appendChild(bubble);
      row.appendChild(face);
      row.appendChild(stack);
      logEl.appendChild(row);
      scrollDown();
    }

    function hideTyping() {
      var node = document.getElementById("typing");
      if (node) node.remove();
    }

    function setAsk(text) {
      var box = document.getElementById("ask");
      box.textContent = "";
      var label = document.createElement("b");
      label.textContent = "いま欲しい答え";
      var body = document.createElement("div");
      body.textContent = text;
      box.appendChild(label);
      box.appendChild(body);
    }

    function boot() {
      logEl.textContent = "";
      var day = document.createElement("div");
      day.className = "day";
      day.textContent = "今日";
      logEl.appendChild(day);
      var lines = Kantoku.opening();
      lines.forEach(function (line, i) {
        addBubble("them", line, i === 0);
      });
      setAsk(convo.pending);
      chips.hidden = false;
    }

    function sleep(ms) {
      return new Promise(function (resolve) {
        setTimeout(resolve, ms);
      });
    }

    async function sendText(text) {
      var value = (text || "").trim();
      if (!value || busy) return;
      busy = true;
      chips.hidden = true;
      addBubble("me", value, false);
      input.value = "";
      fit();
      syncSend();
      showTyping();
      var wait = Math.min(1800, 450 + value.length * 18);
      await sleep(wait);
      var result = Kantoku.reply(value, convo);
      convo.idx = result.idx;
      convo.pending = result.pending;
      convo.nonce += 1;
      hideTyping();
      for (var i = 0; i < result.bubbles.length; i++) {
        addBubble("them", result.bubbles[i], i === 0);
        if (i < result.bubbles.length - 1) await sleep(280);
      }
      setAsk(convo.pending);
      busy = false;
      input.focus();
    }

    function fit() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    }

    function syncSend() {
      sendBtn.classList.toggle("ready", input.value.trim().length > 0);
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      sendText(input.value);
    });

    input.addEventListener("input", function () {
      fit();
      syncSend();
    });

    input.addEventListener("compositionstart", function () {
      composing = true;
    });
    input.addEventListener("compositionend", function () {
      composing = false;
    });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey && !composing) {
        e.preventDefault();
        sendText(input.value);
      }
    });

    chips.addEventListener("click", function (e) {
      var btn = e.target.closest("button");
      if (!btn) return;
      sendText(btn.textContent);
    });

    document.getElementById("levels").addEventListener("click", function (e) {
      var btn = e.target.closest("button");
      if (!btn) return;
      convo.level = Number(btn.getAttribute("data-level"));
      Array.prototype.forEach.call(document.querySelectorAll(".levels button"), function (el) {
        el.classList.toggle("on", el === btn);
      });
    });

    document.getElementById("reset").addEventListener("click", function () {
      var level = convo.level;
      convo = Kantoku.initial();
      convo.level = level;
      busy = false;
      hideTyping();
      boot();
    });

    boot();
    input.focus();
  </script>
</body>
</html>
